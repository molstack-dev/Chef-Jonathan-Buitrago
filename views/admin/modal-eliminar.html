<!-- Modal reusable para confirmación de eliminación en admin (estilo simple: sin correo) -->
<div id="delete-confirm-admin-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
  <div class="bg-gray-800 p-6 rounded-xl max-w-lg mx-4 shadow-2xl border border-gray-700 w-full">
    <h3 class="text-xl font-semibold text-white mb-4 border-b border-gray-600 pb-3">Confirmar eliminación</h3>
    <p id="delete-confirm-admin-message" class="text-gray-300 mb-4">¿Seguro que deseas eliminar este elemento?</p>

    <div class="flex justify-end gap-3">
      <button type="button" id="delete-confirm-admin-cancel" class="px-4 py-3 bg-gray-700 text-white rounded-lg hover:bg-gray-600">Cancelar</button>
      <button type="button" id="delete-confirm-admin-confirm" class="px-4 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700">Eliminar</button>
    </div>
  </div>
</div>
