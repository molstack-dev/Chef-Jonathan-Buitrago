                        <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16"><path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg>

        </header>

        <!-- Sección de Recuperar Contraseña -->
        <section class="py-24 bg-gray-900 min-h-screen" style="background-image: url('../img/chef_jonathan_buitrago_post_10_1_2019_9_40_511953801005171047268.jpg'); background-size: cover; background-position: center;">
            <div class="container mx-auto px-6 pt-12">
                <div class="max-w-md mx-auto">
                    <div class="product-card p-8 rounded-xl bg-gray-800 bg-opacity-90">
                        <h4 class="text-2xl font-semibold mb-6 text-white text-center">Recuperar Contraseña</h4>

                        <!-- Paso 1: Ingresar email -->
                        <div id="step1">
                            <p class="text-gray-400 mb-6 text-center text-sm">Ingresa tu email para verificar tu identidad.</p>
                            <form id="email-form">
                                <div class="mb-6">
                                    <label for="email" class="block text-gray-300 mb-2">Correo Electrónico</label>
                                    <input type="email" id="email" class="w-full" required>
                                </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white py-3 rounded-lg font-semibold shadow-lg hover:opacity-90 transition-opacity">
                                    Verificar Email
                                </button>
                            </form>
                        </div>

                        <!-- Paso 2: Responder pregunta y nueva contraseña -->
                        <div id="step2" class="hidden">
                            <p class="text-gray-400 mb-4 text-center text-sm">Responde tu pregunta de seguridad para recuperar tu contraseña.</p>
                            <div id="security-question-display" class="mb-4 p-3 bg-gray-700 rounded text-gray-300 text-center"></div>
                            <form id="reset-form">
                                <input type="hidden" id="user-id">
                                <div class="mb-4">
                                    <label for="security-answer" class="block text-gray-300 mb-2">Tu Respuesta</label>
                                    <input type="text" id="security-answer" class="w-full" required>
                                </div>
                                <div class="mb-4">
                                    <label for="new-password" class="block text-gray-300 mb-2">Nueva Contraseña</label>
                                    <div class="relative">
                                        <input type="password" id="new-password" class="w-full pr-10 has-password-toggle" required minlength="6">
                                        <span class="password-toggle absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer" onclick="togglePassword('new-password')">
                                            <i class="fas fa-eye text-gray-500"></i>
                                        </span>
                                    </div>
                                <div class="mb-6">
                                    <label for="confirm-password" class="block text-gray-300 mb-2">Confirmar Nueva Contraseña</label>
                                    <div class="relative">
                                        <input type="password" id="confirm-password" class="w-full pr-10 has-password-toggle" required minlength="6">
                                        <span class="password-toggle absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer" onclick="togglePassword('confirm-password')">
                                            <i class="fas fa-eye text-gray-500"></i>
                                        </span>
                                    </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white py-3 rounded-lg font-semibold shadow-lg hover:opacity-90 transition-opacity">
                                    Cambiar Contraseña
                                </button>
                            </form>
                        </div>

                        <!-- Mensaje de éxito/error -->
                        <div id="message" class="mt-4 text-center hidden"></div>

                        <div class="mt-6 text-center">
                            <a href="registro.html" class="text-amber-500 hover:text-amber-400 text-sm">Volver al inicio de sesión</a>
                        </div>
                </div>
        </section>

        <!-- Footer -->
        <footer class="border-t border-white-700 py-4">
            <div class="w-full mx-auto max-w-screen-xl p-2 flex flex-col sm:flex-row items-center justify-between">
                <span class="text-xs text-gray-400">
                    © 2025 <a href="../index.html" class="text-white parisienne-font hover:text-purple-500">Chef Jonathan Buitrago</a>. Todos los derechos reservados.
                </span>
            </div>
        </footer>

        <script>
        // Paso 1: Verificar email
        document.getElementById('email-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;

            fetch('../backend/api/forgot-password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.step === 'question') {
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    document.getElementById('user-id').value = data.user_id;
                    document.getElementById('security-question-display').textContent = data.security_question;
                } else if (data.success && data.step === 'verify') {
                    showToast(data.message, 'success');
                } else {
                    showToast(data.message, 'error');
                }
            })
            .catch(error => {
                showToast('Error al procesar solicitud', 'error');
            });
        });

        // Paso 2: Cambiar contraseña
        document.getElementById('reset-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const userId = document.getElementById('user-id').value;
            const securityAnswer = document.getElementById('security-answer').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showToast('Las contraseñas no coinciden', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showToast('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            fetch('../backend/api/forgot-password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    security_answer: securityAnswer,
                    new_password: newPassword
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('message').textContent = 'Contraseña cambiada. Ahora puedes iniciar sesión.';
                    document.getElementById('message').className = 'mt-4 text-center text-green-500';
                    document.getElementById('message').classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'registro.html';
                    }, 2000);
                } else {
                    showToast(data.message, 'error');
                }
            })
            .catch(error => {
                showToast('Error al procesar solicitud', 'error');
            });
        });

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = type === 'success'
                ? 'bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg'
                : 'bg-red-600 text-white px-4 py-2 rounded-lg shadow-lg';
            toast.textContent = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function togglePassword(inputId) {
            const passwordField = document.getElementById(inputId);
            const iconSpan = passwordField.parentNode.querySelector('.password-toggle i');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                iconSpan.classList.remove('fa-eye');
                iconSpan.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                iconSpan.classList.remove('fa-eye-slash');
                iconSpan.classList.add('fa-eye');
            }
        }
        </script>
    </body>
